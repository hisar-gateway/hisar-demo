# Hisar API Gateway — free edition, single host
#
#   docker compose up -d
#   docker compose logs apigateway | grep "INITIAL ADMIN"   # first admin password
#   http://localhost:8080          admin console
#   http://localhost:3000/health   gateway
#
# The gateway runs unlicensed: at most 5 routes and 10 requests/s per route,
# licensed modules off. Upload a licence in the admin console under
# Operations → License to lift the caps — same installation, no restart.
#
# An evaluation layout: one gateway, plain HTTP, no TLS edge, and a signing key
# generated at start (restarting the gateway signs everyone out).

name: hisar-demo

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped

  surrealdb:
    image: surrealdb/surrealdb:v3.3.0
    user: "0:0"
    command: start --user ${DATABASE_USER:-root} --pass ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env} --bind 0.0.0.0:8000 surrealkv:///data/database
    volumes:
      - surrealdb_data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Request, audit and security logs behind the dashboard's log panels.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  apigateway:
    image: ghcr.io/hisar-gateway/apigateway-backend:${HISAR_VERSION:-latest}
    # Images are published for linux/amd64 only; on Apple silicon Docker
    # Desktop runs them through Rosetta.
    platform: linux/amd64
    ports:
      - "${HISAR_GATEWAY_PORT:-3000}:3000"   # host port: HISAR_GATEWAY_PORT in .env
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Europe/Istanbul}
    volumes:
      # GeoIP database uploaded in the console (Operations → System → Geo
      # blocking), kept across image updates. The container runs as uid 1000.
      - geoip_data:/app/geoip
    depends_on:
      redis:
        condition: service_healthy
      surrealdb:
        condition: service_healthy
      # Waits for Elasticsearch so the first logs reach it; starts anyway (with
      # a warning) if Elasticsearch never becomes healthy.
      elasticsearch:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Open files: every proxied request holds a client and an upstream socket.
    # Docker >= 25 starts a container at a soft limit of 1024, which ran out
    # near 500 concurrent proxied requests ("Too many open files", 502).
    # One value = soft and hard: a hard limit above the runtime's own (rootless
    # Docker, LXC) would stop the container from starting.
    ulimits:
      nofile: 65535
    restart: unless-stopped

  frontend:
    image: ghcr.io/hisar-gateway/apigateway-frontend:${HISAR_VERSION:-latest}
    platform: linux/amd64
    ports:
      - "${HISAR_UI_PORT:-8080}:80"   # host port: HISAR_UI_PORT in .env
    networks:
      default:
        # A fixed address: the gateway reads the console's X-Forwarded-For
        # from exactly this container (TRUSTED_PROXIES in .env), so every
        # console user is counted on their own address.
        ipv4_address: ${HISAR_UI_ADDRESS:-172.30.100.10}
    depends_on:
      apigateway:
        condition: service_healthy
    restart: unless-stopped

# The compose network on a fixed subnet, so the console container can keep a
# fixed address (above) and .env can name it in TRUSTED_PROXIES. If the range
# is already taken on this machine (`docker compose up` stops with "Pool
# overlaps with other one on this address space"), move it with
# HISAR_NET_SUBNET and HISAR_UI_ADDRESS in .env — and keep TRUSTED_PROXIES in
# step.
networks:
  default:
    ipam:
      config:
        - subnet: ${HISAR_NET_SUBNET:-172.30.100.0/24}

volumes:
  redis_data:
  surrealdb_data:
  elasticsearch_data:
  geoip_data:
